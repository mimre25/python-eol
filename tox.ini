[tox]
skip_missing_interpreters = {env:TOX_SKIP_MISSING_INTERPRETERS:True}
envlist = py{3.8,3.9,3.10,3.11,3.12,3.13},lint
isolated_build = True

[testenv]
skip_install = true
deps =
    pytest
    coverage
    freezegun
    requests
    appdirs
    setuptools
    beautifulsoup4
commands =
    coverage run -m pytest {posargs}

[testenv:py{3.9,3.10,3.11,3.12,3.13}]
commands =
    {[testenv]commands}
    coverage xml

[testenv:py3.8]
commands =
    {[testenv]commands}
    coverage xml

[testenv:ruff]
skip_install = true
deps = ruff
commands = ruff check --fix python_eol/ tests/

[testenv:mypy]
skip_install = true
deps =
  mypy
  types-setuptools
  types-freezegun
  pytest
  types-requests
  types-beautifulsoup4
commands = mypy python_eol/ tests/

[testenv:yamlfix]
skip_install = true
deps = yamlfix
commands = yamlfix .

[testenv:lint]
skip_install = true
deps =
    {[testenv:ruff]deps}
    {[testenv:mypy]deps}
    {[testenv:yamlfix]deps}
commands =
    {[testenv:ruff]commands}
    {[testenv:mypy]commands}
    {[testenv:yamlfix]commands}
